services:
  postgres:
    image: postgres:16-alpine
    container_name: nemesis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nemesis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nemesis_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-nemesis_x}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nemesis} -d ${POSTGRES_DB:-nemesis_x}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nemesis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: nemesis-backend
    restart: unless-stopped
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nemesis}:${POSTGRES_PASSWORD:-nemesis_secret_password}@postgres:5432/${POSTGRES_DB:-nemesis_x}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../uploads:/app/uploads
      - ../evidence:/app/evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: nemesis-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
